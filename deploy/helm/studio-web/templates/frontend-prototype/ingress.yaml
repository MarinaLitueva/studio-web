{{- if and .Values.ingress.enabled .Values.frontendPrototype.enabled .Values.frontendPrototype.hostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "studio-web.fullname" . }}-frontend-prototype
  labels: {{- include "studio-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-prototype
  {{- with .Values.frontendPrototype.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.frontendPrototype.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.frontendPrototype.hostname | quote }}
      http:
        paths:
          # Keep API traffic same-origin for the browser. IDE `/studio/...`
          # traffic falls through to the prototype nginx, which performs the
          # required rewrite and WebSocket proxying to the backend.
          {{- if .Values.backend.fileStorage.enabled }}
          - path: /api/file-storage-data
            pathType: Prefix
            backend:
              service:
                name: {{ include "studio-web.fullname" . }}-backend
                port: { name: file-storage }
          {{- end }}
          - path: /cf
            pathType: Prefix
            backend:
              service:
                name: {{ include "studio-web.fullname" . }}-backend
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "studio-web.fullname" . }}-frontend-prototype
                port: { name: http }
{{- end }}
