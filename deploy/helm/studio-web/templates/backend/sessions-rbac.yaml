{{- if .Values.backend.sessions.enabled }}
# The Kubernetes session driver (studio-session, ADR-0003) creates one Pod +
# Service per IDE session in this namespace through the API. Grant the backend
# ServiceAccount exactly that, namespaced — never cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "studio-web.fullname" . }}-sessions
  labels: {{- include "studio-web.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "studio-web.fullname" . }}-sessions
  labels: {{- include "studio-web.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "studio-web.fullname" . }}-sessions
subjects:
  - kind: ServiceAccount
    name: {{ include "studio-web.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
