{{- if and .Values.backend.sessions.enabled .Values.backend.autoscaling.enabled }}
{{- fail "backend.autoscaling.enabled must be false while backend.sessions.enabled is true (session registry is process-local)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "studio-web.fullname" . }}-backend
  labels: {{- include "studio-web.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: {{- include "studio-web.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels: {{- include "studio-web.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- if and .Values.backend.fileStorage.enabled .Values.backend.fileStorage.secretRevision }}
      annotations:
        checksum/file-storage-secrets: {{ .Values.backend.fileStorage.secretRevision | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "studio-web.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      # ghcr packages published by GITHUB_TOKEN start private — without a
      # pull secret the pod never leaves ImagePullBackOff.
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ required "backend.image.tag is required (immutable, fixed at chart publication)" .Values.backend.image.tag }}"
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["--config", "config/{{ .Values.backend.configProfile }}.yaml", "run"]
          {{- if .Values.backend.configOverride.existingConfigMap }}
          volumeMounts:
            - name: backend-config
              mountPath: /app/config/{{ .Values.backend.configProfile }}.yaml
              subPath: {{ .Values.backend.configProfile }}.yaml
              readOnly: true
          {{- end }}
          ports: [{ name: http, containerPort: {{ .Values.backend.port }} }]
          env:
            - name: STUDIO_ENVIRONMENT
              value: {{ .Values.global.environmentName | quote }}
            - name: STUDIO_SESSION_ENABLED
              value: {{ .Values.backend.sessions.enabled | quote }}
            - name: STUDIO_SESSION_IMAGE
              value: "{{ .Values.backend.sessions.image.repository }}:{{ default .Values.backend.image.tag .Values.backend.sessions.image.tag }}"
            - name: STUDIO_SESSION_GATEWAY_URL
              value: "http://{{ include "studio-web.fullname" . }}-backend:{{ .Values.backend.port }}/cf"
            - name: STUDIO_PG_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: {{ .Values.backend.database.keys.host }} } }
            - name: STUDIO_PG_PORT
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: {{ .Values.backend.database.keys.port }} } }
            - name: STUDIO_PG_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: {{ .Values.backend.database.keys.user }} } }
            - name: STUDIO_PG_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: {{ .Values.backend.database.keys.password }} } }
            - name: STUDIO_PG_DBNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: {{ .Values.backend.database.keys.dbname }} } }
            - name: STUDIO_OIDC_ISSUER
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.auth.existingSecret }}, key: issuer_url } }
            - name: STUDIO_OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.auth.existingSecret }}, key: client_id } }
            - name: STUDIO_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.auth.existingSecret }}, key: client_secret } }
            # S2S client credentials (mini-chat -> IdP); optional — dev realm
            # default applies when the key is absent.
            - name: STUDIO_OIDC_S2S_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.appSecrets.existingSecret }}, key: s2s_client_secret, optional: true } }
            # LLM egress (Theia AI proxy + mini-chat). Key is secret; provider
            # endpoint/model are plain values (see backend.llm).
            - name: STUDIO_LLM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.appSecrets.existingSecret }}, key: llm_api_key } }
            - name: STUDIO_LLM_BASE_URL
              value: {{ .Values.backend.llm.baseUrl | quote }}
            - name: STUDIO_LLM_MODEL
              value: {{ .Values.backend.llm.model | quote }}
            - name: STUDIO_LLM_HOST
              value: {{ .Values.backend.llm.host | quote }}
            # file-storage URL-signing seed — per environment, never baked in.
            - name: STUDIO_FS_SIGNING_SEED
              {{- if .Values.backend.fileStorage.enabled }}
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.fileStorage.secrets.signingExistingSecret }}, key: signing_seed } }
              {{- else }}
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.appSecrets.existingSecret }}, key: fs_signing_seed } }
              {{- end }}
            {{- if .Values.backend.fileStorage.enabled }}
            - name: STUDIO_FS_SIDECAR_BASE_URL
              value: {{ default (printf "https://%s" .Values.global.hostname) .Values.backend.fileStorage.publicBaseUrl | quote }}
            - name: STUDIO_FS_BACKEND_ID
              value: {{ .Values.backend.fileStorage.backendId | quote }}
            - name: STUDIO_FS_S3_BACKENDS
              value: {{ include "studio-web.fileStorageS3Backends" . | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.fileStorage.secrets.s3ExistingSecret }}, key: access_key_id } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.fileStorage.secrets.s3ExistingSecret }}, key: secret_access_key } }
            {{- end }}
            # Sealing key for the persistent credstore value store (#66),
            # base64 of 32 bytes. Optional by design: without it the gear
            # stands down with a WARN and the in-memory fallback wins — the
            # pod still boots, but every user-typed secret (repo PATs) dies
            # with each restart. Set it in any environment that restarts pods,
            # which is all of them.
            - name: STUDIO_CREDSTORE_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.appSecrets.existingSecret }}, key: credstore_key, optional: true } }
            # Keycloak Admin API for invites (keycloak-idp-plugin). Optional:
            # without the secret the plugin self-deprioritizes (invites off).
            {{- if .Values.backend.idpAdmin.baseUrl }}
            - name: STUDIO_IDP_ADMIN_BASE_URL
              value: {{ .Values.backend.idpAdmin.baseUrl | quote }}
            - name: STUDIO_IDP_ADMIN_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.appSecrets.existingSecret }}, key: idp_admin_secret, optional: true } }
            {{- end }}
          readinessProbe: { httpGet: { path: /cf/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /cf/health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
        {{- if .Values.backend.fileStorage.enabled }}
        - name: file-storage-sidecar
          image: "{{ .Values.backend.fileStorage.image.repository }}:{{ default .Values.backend.image.tag .Values.backend.fileStorage.image.tag }}"
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: file-storage, containerPort: 8087 }]
          env:
            - name: FS_SIDECAR_ADDR
              value: "0.0.0.0:8087"
            # The pinned sidecar always registers its compatibility local-fs
            # backend and includes it in /readyz, even when all application
            # traffic is routed to S3. Point it at an existing writable
            # ephemeral directory so that readiness reflects S3 availability.
            - name: FS_SIDECAR_BACKEND_ROOT
              value: "/tmp"
            - name: FS_SIDECAR_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.fileStorage.secrets.signingExistingSecret }}, key: sidecar_public_key } }
            - name: FS_SIDECAR_CONTROL_URL
              value: "http://127.0.0.1:{{ .Values.backend.port }}/cf"
            - name: FS_SIDECAR_S3_BACKENDS
              value: {{ include "studio-web.fileStorageS3Backends" . | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.fileStorage.secrets.s3ExistingSecret }}, key: access_key_id } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.fileStorage.secrets.s3ExistingSecret }}, key: secret_access_key } }
          readinessProbe: { httpGet: { path: /readyz, port: file-storage }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: file-storage }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{- toYaml .Values.backend.fileStorage.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.backend.configOverride.existingConfigMap }}
      volumes:
        - name: backend-config
          configMap:
            name: {{ .Values.backend.configOverride.existingConfigMap }}
      {{- end }}
