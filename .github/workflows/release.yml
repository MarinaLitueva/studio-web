name: Release

# Three ways in:
#   * a `v*` tag  — the real release: images tagged with the version + `latest`
#     and a GitHub Release with the artifacts. Deployment is a separate,
#     manually approved workflow in deploy.yml.
#   * a push to main — images only, tagged `edge` and `sha-<short>`, so there is
#     something to pull between releases (studio-session already expects an
#     `:edge` tag for the Theia image; this gives the stack the same habit).
#   * manual — the reason `workflow_dispatch` is here at all: without it the
#     Actions page for this workflow has no "Run workflow" button, so a rebuild
#     of an unchanged tree meant pushing an empty commit or a throwaway tag.
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also move the `latest` tag to this build"
        type: boolean
        default: false

permissions:
  contents: write   # GitHub Release
  packages: write   # GHCR push

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend-binary:
    # Pinned, not `-latest`: the binary links the builder's glibc, and the
    # runtime image (Dockerfile, debian:trixie-slim, glibc 2.41) must be at
    # least as new. `ubuntu-latest` moving to a newer glibc than trixie would
    # resurrect "version GLIBC_X.YY not found" at container start — bump the
    # runner and the runtime base TOGETHER.
    runs-on: ubuntu-24.04
    steps:
      # Cargo.lock pins the exact gears-rust revision, so rebuilding the same
      # commit resolves the same Rust sources.
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-backend

      - name: Build (release)
        working-directory: studio-backend
        # Keep LLM disabled, but compile graph-storage for the Kubernetes test
        # profile. The matching graph-postgres image is built and verified in
        # the images job below before either image is published.
        run: cargo build --locked --release --no-default-features --features graph

      - uses: actions/upload-artifact@v4
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/target/release/studio-backend

  # Builds the FrontX-based studio-frontend/ — the deployed portal since it
  # replaced studio-frontend-prototype/ (now a playground with its own image).
  frontend-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio-frontend/package-lock.json
      - run: npm ci
      # Build before test: the suites resolve workspace packages through
      # their dist/ entries, which only the build produces (same as ci.yml).
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist

  # The pre-FrontX prototype ships as its OWN image and rides along in
  # compose on :8081. It is tested and built only here, at release time —
  # ci.yml deliberately does not gate on it.
  prototype-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-frontend-prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-prototype-dist
          path: studio-frontend-prototype/dist

  images:
    needs: [backend-binary, frontend-dist, prototype-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/.release/
      - uses: actions/download-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: studio-frontend-prototype-dist
          path: studio-frontend-prototype/dist

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr rejects any reference with an uppercase letter, and
      # `github.repository` carries the owner's name exactly as registered —
      # `AndrejK666/studio-web` here. GitHub expressions have no lowercase
      # function, so it is done in the shell, and it has to overwrite the
      # workflow-level IMAGE_PREFIX rather than define a second variable: the
      # build steps below already read $IMAGE_PREFIX, and two names for one
      # thing is how the wrong one gets used later.
      - name: Lowercase the image prefix
        run: |
          set -euo pipefail
          lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/$lower" >> "$GITHUB_ENV"

      # A tag release gets the version and `latest`; anything else gets `edge`
      # and an immutable `sha-` tag. `latest` is deliberately NOT moved by a
      # main push: something has to keep meaning "the last release".
      - name: Work out the image tags
        id: tags
        run: |
          set -euo pipefail
          short="sha-$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "list=${{ github.ref_name }} latest $short" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish_latest }}" = "true" ]; then
            echo "list=edge latest $short" >> "$GITHUB_OUTPUT"
          else
            echo "list=edge $short" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend image
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/studio-backend:$t")
          done
          docker build -f studio-backend/Dockerfile "${args[@]}" studio-backend

      - name: Build graph PostgreSQL CloudNativePG operand
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/graph-postgres:$t")
          done
          docker build -f studio-backend/docker/graph-postgres/Dockerfile "${args[@]}" studio-backend/docker/graph-postgres

      - name: Verify graph PostgreSQL CloudNativePG compatibility
        run: bash studio-backend/docker/graph-postgres/verify-cnpg-compatibility.sh "$IMAGE_PREFIX/graph-postgres:sha-$(git rev-parse --short HEAD)"

      - name: Push backend and graph PostgreSQL images
        run: |
          set -euo pipefail
          for t in ${{ steps.tags.outputs.list }}; do
            docker push "$IMAGE_PREFIX/studio-backend:$t"
            docker push "$IMAGE_PREFIX/graph-postgres:$t"
          done

      - name: Build & push frontend image
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/studio-frontend:$t")
          done
          docker build -f studio-frontend/Dockerfile "${args[@]}" studio-frontend
          for t in ${{ steps.tags.outputs.list }}; do
            docker push "$IMAGE_PREFIX/studio-frontend:$t"
          done

      # Same nginx runtime recipe as the main frontend, its own dist and name.
      - name: Build & push frontend prototype image
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/studio-frontend-prototype:$t")
          done
          docker build -f studio-frontend-prototype/Dockerfile "${args[@]}" studio-frontend-prototype
          for t in ${{ steps.tags.outputs.list }}; do
            docker push "$IMAGE_PREFIX/studio-frontend-prototype:$t"
          done

      # The per-workspace Theia IDE session image (moved in from fabric-poc).
      # Self-contained multi-stage build from theia/ — no artifact to download,
      # it downloads Theia plugins at build time (needs network, ~10 min).
      # studio-session pulls this by the `image:` in config/*.yaml.
      - name: Build & push Theia session image
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/cf-studio-theia:$t")
          done
          docker build -f theia/Dockerfile "${args[@]}" theia
          for t in ${{ steps.tags.outputs.list }}; do
            docker push "$IMAGE_PREFIX/cf-studio-theia:$t"
          done
      # Custom Keycloak runtime (real SSO, INFRA-3767). The public image is an
      # optimized runtime only: environment realms and all credentials are
      # mounted from namespace-local Secrets by Helm.
      - name: Build & push Keycloak image
        # Skipped where the keycloak/ build context is absent (the concept
        # branch has no keycloak/ dir — that work lives on the keycloak branch):
        # main still builds it, branches without it skip instead of failing the
        # whole image job. Re-enables itself automatically once keycloak/ lands.
        if: hashFiles('keycloak/Dockerfile') != ''
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/cf-studio-keycloak:$t")
          done
          docker build -f keycloak/Dockerfile "${args[@]}" keycloak
          for t in ${{ steps.tags.outputs.list }}; do
            docker push "$IMAGE_PREFIX/cf-studio-keycloak:$t"
          done
      - name: Summary
        run: |
          {
            echo "### Images published"
            for t in ${{ steps.tags.outputs.list }}; do
              echo "- \`$IMAGE_PREFIX/studio-backend:$t\`"
              echo "- \`$IMAGE_PREFIX/graph-postgres:$t\`"
              echo "- \`$IMAGE_PREFIX/studio-frontend:$t\`"
              echo "- \`$IMAGE_PREFIX/studio-frontend-prototype:$t\`"
              echo "- \`$IMAGE_PREFIX/cf-studio-theia:$t\`"
              echo "- \`$IMAGE_PREFIX/cf-studio-keycloak:$t\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [backend-binary, frontend-dist]
    # A main push publishes images, not releases.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack artifacts
        run: |
          cd artifacts
          tar czf studio-backend-linux-x86_64.tar.gz -C studio-backend-linux-x86_64 .
          tar czf studio-frontend-dist.tar.gz -C studio-frontend-dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/studio-backend-linux-x86_64.tar.gz
            artifacts/studio-frontend-dist.tar.gz
