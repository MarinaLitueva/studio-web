name: CI

on:
  push:
    # Internal feature branches need an exact-SHA CI result before their
    # snapshot images may be published for dev. Tags reuse the CI result of
    # the commit they point at, so only branch pushes are selected here.
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # studio-frontend-prototype/ is deliberately NOT filtered: the
          # prototype playground no longer gates CI — release.yml builds and
          # tests it when it publishes the studio-frontend-prototype image.
          filters: |
            backend:
              - 'studio-backend/**'
              - '.github/workflows/**'
            frontend:
              - 'studio-frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-backend
    steps:
      # gears-rust is a git dependency pinned in Cargo.toml — no second
      # checkout, and no second place to keep the revision in sync.
      - uses: actions/checkout@v6

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-backend

      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: "Smoke: assembly resolves 13 gears"
        run: |
          cargo run --locked -- --config config/dev.yaml --list-gears | tee gears.txt
          grep -q 'account-management' gears.txt

  # The FrontX-based studio-frontend/ (ADR-0006) is the deployed portal;
  # this used to build studio-frontend-prototype/, which is now a playground
  # built only at release time (see release.yml, prototype-dist).
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio-frontend/package-lock.json
      - name: Install
        run: npm ci
      # Build precedes Test: the test suites resolve workspace packages
      # (@gears-frontx/react et al.) through their dist/ entries, which only
      # the build produces — on a fresh checkout Test-first fails to resolve.
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - uses: actions/upload-artifact@v6
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist
          retention-days: 7
